services:
  npc:
    build: ./backend
    # The status panel needs a terminal, and Enter (pause/resume) needs stdin.
    stdin_open: true
    tty: true
    volumes:
      - ./backend/games-history:/app/games-history

  web:
    build: ./frontend
    # WEB_PORT=3000 docker compose up web serves on another port.
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
